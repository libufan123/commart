; ============================================================================
; Godot 4.3 · Android 导出预设  ——  《沟通的艺术 · 沟通技能学习游戏》
; 编写：engineering-lead（程基岩）· 为「生成 Android App」准备
; ----------------------------------------------------------------------------
; ⚠️ 本文件为手工编写，未经本沙箱 Godot 运行校验（沙箱无 Godot / Android SDK）。
;    键名严格对齐 Godot 4.3 Android 导出插件（editor/export/export_plugin.cpp）属性。
;    在 Godot 4.3 编辑器「项目 → 导出」打开本预设后，个别字段可能被自动补全/改写，
;    属正常现象；下方标注「★需在 Godot 4.3 导出窗口校正」的项如与本地不一致，以编辑器为准。
;
; 导出模板（Export Templates）要求：
;   需在 Godot 编辑器「Editor → Manage Export Templates」下载匹配 4.3 的官方模板（r4.3），
;   或交由 CI（barichello/godot-ci@6）自动注入。无模板无法出包。
;
; 默认产出：debug 签名 APK（Godot 自带 debug keystore），可直接 adb install 侧载测试。
;   上架 Google Play 需 release 签名，见本文件末尾注释与 .github/workflows/build-android.yml。
; ============================================================================

[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 发布包剔除 GUT 测试框架与单元/等价测试，减小体积、避免调试入口。
; （godot/addons/ 当前不存在；tests/ 为 res://tests/ 单元与等价校验脚本。）
exclude_filter="addons/gut/*;tests/*"
include_filter=""
export_path=""
patches=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; ---- 包名 / 显示名 ---------------------------------------------------------
package/unique_name="com.commart.app"      ; Android 应用 ID（反向域名）
package/name="沟通的艺术"                    ; 安装后显示名

; 签名：false = 使用 Godot 自带 debug keystore，产出可侧载 debug APK。
; 上架时改为 true 并填 keystore/release 等（见文件末尾注释 + CI 工作流）。
package/signed=false

; ---- 版本号 ----------------------------------------------------------------
; ★ 注意：Godot 4.3 实际键名为 version/code（int）与 version/name（string），
;   并非 Godot 3.x 时代的 package/version_code / package/version_name。
;   已按 4.3 正确键名填写；若编辑器打开后被改写，以编辑器为准。
version/code=1
version/name="0.1.0"
version/allowed_failure=3

; ---- 屏幕 / 仅竖屏 ---------------------------------------------------------
screen/orientation="portrait"              ; 仅竖屏
screen/immersive_mode=true                 ; 沉浸模式（隐藏系统导航条）
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; ---- CPU 架构（兼顾新/旧设备）---------------------------------------------
architectures/arm64-v8a=true               ; 主流 64 位（必需，Play 商店要求）
architectures/armeabi-v7a=true             ; 旧 32 位设备兼容
; 以下两项默认关闭（仅部分模拟器/ChromeOS 需要，按需开启）
architectures/x86=false
architectures/x86_64=false

; ---- 图形 ------------------------------------------------------------------
graphics/texture_format="etc2_astc"        ; Android 推荐 ETC2/ASTC
graphics/use_depth_32=true
graphics/shader_cache=true

; ---- 应用图标（SVG，Godot 自动生成各密度 png / 自适应图标）----------------
application/icon="res://icon.svg"

; ---- 权限（切片无需联网/存储，保持最小权限集；缺省即为 false）------------
; Godot 4.x 标准权限键；如你的 4.3 版本对此处键名报警，可整段删除（不影响出包）。
permissions/internet=false
permissions/access_network_state=false
permissions/write_external_storage=false
permissions/read_external_storage=false

; ---- XR（不适用，省略 xr_features/* 整组）--------------------------------

; ============================================================================
; 上架 Google Play 的 release 签名（默认不启用，仅作指引）：
;   1) 本地生成 keystore：
;        keytool -genkey -v -keystore commart.keystore -alias commart \
;                -keyalg RSA -keysize 2048 -validity 10000
;   2) 在 Godot 导出窗口勾选 package/signed=true，并填以下路径/口令：
;        keystore/release="res://commart.keystore"   (或绝对路径)
;        keystore/release_user="commart"
;        keystore/release_password="<keystore 密码>"
;      或者用命令行：
;        godot --headless --export-release "Android" commart.apk
;   3) CI 方式见 .github/workflows/build-android.yml 末尾注释（PLAY_KEYSTORE_BASE64 / KEYSTORE_PASSWORD 等 Secret）。
; ============================================================================
