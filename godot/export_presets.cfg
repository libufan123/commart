; ============================================================================
; Godot 4.3 · Android 导出预设 —— 《沟通的艺术 · 沟通技能学习游戏》
; 编写：engineering-lead（程基岩）
; ----------------------------------------------------------------------------
; ⚠️ 手工编写，未经沙箱 Godot 运行校验（沙箱无 Godot / Android SDK）。
;    键名对齐 Godot 4.3 platform/android/export/export_plugin.cpp 的
;    get_export_options() 注册项。
;
; 【第二轮修复 E7-S3 的四处改动，均为实打实的 bug，不是风格调整】
;   1) package/signed  false → true
;      false 会产出**未签名 APK**，手机安装时直接报「应用未安装」。
;      debug 签名由 CI 生成的 debug.keystore 提供（环境变量 + 编辑器设置双通道注入）。
;   2) include_filter  "" → "*.json"
;      export_filter="all_resources" 只收「资源」；.json 在 Godot 4 里默认被
;      归为 TextFile，**不会进包**。而 DataLoader.gd 是用 FileAccess/DirAccess
;      直接读 res://data/**.json 的（9 个文件：8 个场景 + skills_index）。
;      不加这条 → APK 能装能开，但一条剧情数据都读不到。
;   3) exclude_filter  分隔符 ";" → ","
;      Godot 的过滤器按**逗号**切分；写成分号会被当成一整条模式串，等于没排除。
;   4) 显式写出 gradle_build/use_gradle_build=false
;      原注释称「省略 = 使用默认 gradle 构建」是**错的**：Godot 4 的默认值就是
;      false（不走 gradle，用预编译模板 android_debug.apk）。CI 正是按这条路径
;      准备环境（只需 apksigner + JDK，不装 gradle），故显式钉死，避免误改。
;
; 【格式约定】本文件不再使用**行尾注释**（形如 key=value  ; 说明）。
;   Godot 自己写出的 .cfg 从不带行尾注释，其解析器对此的支持未经我方验证；
;   为消除这一不确定性，所有注释一律独占整行。
;
; 导出模板：CI 工作流自行从 Godot 官方 Release 下载 .tpz 并安装到
;           ~/.local/share/godot/export_templates/4.3.stable/（不再依赖任何容器镜像）。
; ============================================================================

[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"

; 排除测试与 GUT 框架：减小体积、避免调试入口。
; 注意分隔符必须是逗号（Godot 按 "," 切分过滤器）。
exclude_filter="addons/gut/*,tests/*"

; ★ 关键：把 .json 显式纳入打包。
;   res://data/scenarios/*.json（8 个）与 res://data/skills_index.json
;   由 DataLoader.gd 经 FileAccess/DirAccess 读取，属于「非资源文件」，
;   不写这条过滤器就不会被打进 APK。
include_filter="*.json"

export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; ---- 构建方式 -------------------------------------------------------------
; false = 使用官方预编译模板 android_debug.apk（CI 已下载安装）。
; 只需 apksigner + zipalign + JDK，不需要完整 gradle 工具链。
; 改成 true 会要求「安装 Android 构建模板」并跑真 gradle 构建，CI 会失败。
gradle_build/use_gradle_build=false

; 0 = APK（可直接侧载）；1 = AAB（上架 Google Play 用，且必须配合 gradle 构建）。
gradle_build/export_format=0

; ---- 包名 / 显示名 ---------------------------------------------------------
; Android 应用 ID（反向域名）
package/unique_name="com.commart.app"
; 安装后在桌面显示的名字
package/name="沟通的艺术"

; ---- 签名 -----------------------------------------------------------------
; ★ 必须为 true。false = 产出未签名 APK，Android 会拒绝安装（「应用未安装」）。
; debug 签名材料由 CI 提供，无需在此写死 keystore 路径：
;   · 环境变量 GODOT_ANDROID_KEYSTORE_DEBUG_PATH / _USER / _PASSWORD / _PASS
;   · 编辑器设置 export/android/debug_keystore(_user/_pass)
package/signed=true

; ---- 版本号 ---------------------------------------------------------------
version/code=1
version/name="0.1.0"

; ---- 屏幕 -----------------------------------------------------------------
; 竖屏由 project.godot 的 window/handheld/orientation="portrait" 控制，
; 此处不重复设置（screen/orientation 不是合法的 Android 导出键）。
; 沉浸模式（隐藏系统导航条）
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; ---- CPU 架构（兼顾新/旧设备）---------------------------------------------
; 主流 64 位（必需）
architectures/arm64-v8a=true
; 旧 32 位设备兼容
architectures/armeabi-v7a=true
; 仅模拟器需要，关闭
architectures/x86=false
; 仅模拟器 / ChromeOS，关闭
architectures/x86_64=false

; ---- 图形（Godot 4.3 仅 graphics/opengl_debug 为合法图形键）---------------
graphics/opengl_debug=false

; ---- 权限（本切片无需联网/存储，保持最小权限集）---------------------------
permissions/internet=false
permissions/access_network_state=false
permissions/write_external_storage=false
permissions/read_external_storage=false

; ---- XR（不适用，省略 xr_features/* 整组）--------------------------------
; ---- launcher_icons/*（省略 → 使用 Godot 默认机器人图标，调试包可接受）---

; ============================================================================
; 上架 Google Play 的 release 签名（默认不启用，仅作指引）：
;   1) 本地生成 keystore：
;        keytool -genkey -v -keystore commart.keystore -alias commart \
;                -keyalg RSA -keysize 2048 -validity 10000
;   2) CI 方式见 .github/workflows/build-android.yml 末尾注释
;      （PLAY_KEYSTORE_BASE64 / KEYSTORE_ALIAS / KEYSTORE_PASSWORD 三个 Secret，
;        走 --export-release + GODOT_ANDROID_KEYSTORE_RELEASE_* 环境变量，
;        不需要改本文件）。
;   3) 若要出 AAB：gradle_build/export_format 改 1，
;      且 gradle_build/use_gradle_build 改 true（走完整 gradle 构建，更慢更易错）。
; ============================================================================
