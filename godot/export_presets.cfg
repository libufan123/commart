; ============================================================================
; Godot 4.3 · Android 导出预设 —— 《沟通的艺术 · 沟通技能学习游戏》
; 编写：engineering-lead（程基岩）· 为 CI 生成可侧载 debug APK 准备
; ----------------------------------------------------------------------------
; ⚠️ 手工编写，未经沙箱 Godot 运行校验（沙箱无 Godot / Android SDK）。
;    键名严格对齐 Godot 4.3 源码 platform/android/export/export_plugin.cpp
;    的 get_export_options() 注册的合法键（2026-08 通过 WebFetch 核验源码确认）。
;
; 本次修正相对旧版**删除的非法键**（Godot 4.3 无此键，会被忽略/告警，但不阻塞；
; 为干净与可维护仍移除，避免误以为它们生效）：
;   · version/allowed_failure=3        → 不存在（仅 version/code、version/name）
;   · screen/orientation="portrait"    → 不存在；竖屏由 project.godot 的
;                                         window/handheld/orientation="portrait" 控制
;   · graphics/texture_format="..."    → 不存在（图形组仅 graphics/opengl_debug 合法）
;   · graphics/use_depth_32=true       → 不存在
;   · graphics/shader_cache=true       → 不存在
;   · application/icon="res://icon.svg"→ 不存在；Android 图标走 launcher_icons/* 组
;                                         （此处不设 → 用 Godot 默认机器人图标，调试包可接受）
;
; 导出模板：CI 用 barichello/godot-ci:4.3 容器镜像（已含 4.3 官方模板），无需手动下载。
; 默认产出：debug 签名 APK（CI 步骤6 生成 debug keystore 并注入环境变量），
;          可直接 adb install 侧载测试。上架 Google Play 需 release 签名，见文件末尾注释。
; ============================================================================

[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 发布包剔除 GUT 测试框架与单元/等价测试，减小体积、避免调试入口。
; （godot/addons/ 当前不存在；tests/ 为 res://tests/ 单元与等价校验脚本。）
exclude_filter="addons/gut/*;tests/*"
include_filter=""
export_path=""
patches=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; ---- 包名 / 显示名 ---------------------------------------------------------
package/unique_name="com.commart.app"      ; Android 应用 ID（反向域名）
package/name="沟通的艺术"                    ; 安装后显示名

; 签名：false = 使用 debug keystore 产出可侧载 debug APK。
; CI 步骤6 生成 debug.keystore 并通过环境变量注入
; （GODOT_ANDROID_KEYSTORE_DEBUG_PATH / _USER / _PASSWORD / _PASS），
; 无需在此写死 keystore 路径；Godot 4.2+ 读取这些环境变量覆盖导出窗口里的 debug 配置。
package/signed=false

; ---- 版本号（Godot 4.3 真实键名：version/code(int) / version/name(string)）----
version/code=1
version/name="0.1.0"

; ---- 屏幕 / 仅竖屏 ---------------------------------------------------------
; 竖屏由 project.godot 的 window/handheld/orientation="portrait" 控制，
; 此预设不重复设置（screen/orientation 不是合法的 Android 导出键）。
screen/immersive_mode=true                 ; 沉浸模式（隐藏系统导航条）
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; ---- CPU 架构（兼顾新/旧设备）---------------------------------------------
architectures/arm64-v8a=true               ; 主流 64 位（必需）
architectures/armeabi-v7a=true              ; 旧 32 位设备兼容
architectures/x86=false                     ; 仅模拟器需要，关闭
architectures/x86_64=false                  ; 仅模拟器/ChromeOS，关闭

; ---- 图形（Godot 4.3 仅 graphics/opengl_debug 为合法图形键）---------------
graphics/opengl_debug=false

; ---- 权限（切片无需联网/存储，保持最小权限集；缺省即为 false）------------
permissions/internet=false
permissions/access_network_state=false
permissions/write_external_storage=false
permissions/read_external_storage=false

; ---- XR（不适用，省略 xr_features/* 整组）--------------------------------
; ---- launcher_icons/*（省略 → 使用 Godot 默认机器人图标，调试包可接受）---
; ---- gradle_build/*（省略 → 使用 Godot 4.x 默认 gradle 构建，产出 APK）----

; ============================================================================
; 上架 Google Play 的 release 签名（默认不启用，仅作指引）：
;   1) 本地生成 keystore：
;        keytool -genkey -v -keystore commart.keystore -alias commart \
;                -keyalg RSA -keysize 2048 -validity 10000
;   2) 在 Godot 导出窗口勾选 package/signed=true，并填以下路径/口令：
;        keystore/release="res://commart.keystore"
;        keystore/release_user="commart"
;        keystore/release_password="<keystore 密码>"
;      或用命令行（需 release 环境变量，见 CI 工作流末尾注释）：
;        godot --headless --export-release "Android" commart-release.apk
;   3) CI 方式见 .github/workflows/build-android.yml 末尾注释
;      （PLAY_KEYSTORE_BASE64 / KEYSTORE_PASSWORD 等 Secret，步骤R1~R3）。
;   4) 若要出 AAB：把 gradle_build/export_format 设为 1（默认 0=APK），
;      并确认 gradle_build/use_gradle_build=true。
; ============================================================================
