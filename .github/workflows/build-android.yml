      # - name: "步骤R2 · 导出 release APK"
      #   run: |
      #     mkdir -p "$GITHUB_WORKSPACE/build/android"
      #     cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
      #     godot --headless --verbose \
      #       --export-release "$PRESET_NAME" \
      #       "$GITHUB_WORKSPACE/build/android/commart-release.apk"
