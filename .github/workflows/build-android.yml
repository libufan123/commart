name: Build Android (APK)

# ============================================================================
# 用途：push / PR / 手动触发时，用 GitHub Actions 导出可侧载安装的 debug APK。
# ----------------------------------------------------------------------------
# 关键：barichello/godot-ci 是 **Docker 镜像**（Docker Hub: barichello/godot-ci:4.3），
#       不是 GitHub Action。必须用 `container:` 引用，导出步骤自己手写。
#       旧写法 `uses: barichello/godot-ci@6` 会在解析阶段直接失败（仓库/Action 不存在）。
#
# 镜像内已有（依据其官方 Dockerfile，2026-08 核实）：
#   Godot 4.3            → /usr/local/bin/godot
#   导出模板             → /root/.local/share/godot/export_templates/4.3.stable/
#   编辑器设置(含SDK路径) → /root/.config/godot/editor_settings-4.3.tres
#   debug keystore       → /root/debug.keystore（alias androiddebugkey / 口令 android）
#   Android SDK          → $ANDROID_HOME=/usr/lib/android-sdk（含 build-tools 33.0.2）
#   JDK 17               → openjdk-17-jdk-headless
# 注意：容器 job 的 $HOME 是 /github/home 而非 /root，所以上面这些都要"搬过来"。
#
# 步骤编号与本工作流步骤名一一对应。若构建失败，把红色 ❌ 的那一步展开，
# 复制最后 30 行日志回传即可定位（见 production/CI_修复说明.md）。
# ============================================================================

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # 允许在 Actions 页手动触发

permissions:
  contents: read

env:
  PROJECT_DIR: godot                                  # Godot 工程所在子目录
  PRESET_NAME: Android                                # 必须与 export_presets.cfg 的 name= 完全一致
  OUT_DIR: build/android
  OUT_APK: build/android/commart.apk
  FONT_PATH: godot/assets/fonts/NotoSansSC-Regular.ttf
  THEME_PATH: godot/scripts/theme/portrait_theme.tres

jobs:
  build-android:
    name: Export Godot Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3

    steps:
      # ----------------------------------------------------------------------
      - name: "步骤1 · 检出仓库"
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 环境自检：把关键路径全部打印出来。此步永不失败，只负责"留证据"。
      - name: "步骤2 · 环境自检（只打印，不会失败）"
        run: |
          echo "----- whoami / HOME -----"
          whoami || true
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "----- godot -----"
          godot --version || true
          echo "----- java -----"
          java -version 2>&1 || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "----- android sdk -----"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" 2>/dev/null || echo "(无 build-tools 目录)"
          echo "----- 镜像自带的导出模板 -----"
          ls -la /root/.local/share/godot/export_templates/ 2>/dev/null || echo "(无)"
          echo "----- 镜像自带的编辑器设置 -----"
          ls -la /root/.config/godot/ 2>/dev/null || echo "(无)"
          echo "----- 工程文件 -----"
          ls -la "$PROJECT_DIR" || true

      # ----------------------------------------------------------------------
      # CJK 字体：runner 可访问外网，仓库里没有字体二进制就在这里抓。
      # continue-on-error: true —— 下载失败绝不阻塞出包（中文变方块可接受，出不了包不可接受）。
      - name: "步骤3 · 获取中文字体 Noto Sans SC（失败不阻塞）"
        continue-on-error: true
        run: |
          set -u
          mkdir -p "$(dirname "$FONT_PATH")"
          if [ -s "$FONT_PATH" ]; then
            echo "仓库内已有字体，跳过下载：$FONT_PATH"
            exit 0
          fi
          # 多源 fallback。前两个是同一份 Google Fonts 可变字重 TTF 的不同网络路径，
          # 第三个是 Noto CJK 官方 SubsetOTF（OTTO 头，Godot/FreeType 按内容识别，扩展名叫 .ttf 不影响）。
          URLS="
          https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf
          https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf
          https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf
          "
          TMP="${FONT_PATH}.tmp"
          for U in $URLS; do
            echo "==> 尝试下载：$U"
            rm -f "$TMP"
            # 镜像内有 wget（没有 curl），故统一用 wget。
            if wget -q --tries=3 --timeout=90 -O "$TMP" "$U"; then
              SZ=$(stat -c%s "$TMP" 2>/dev/null || echo 0)
              # 字体魔数校验：00010000(TrueType) / true / OTTO(CFF) / ttcf(集合)
              MAGIC=$(od -An -tx1 -N4 "$TMP" 2>/dev/null | tr -d ' \n')
              echo "    大小=${SZ}B 魔数=${MAGIC}"
              case "$MAGIC" in
                00010000|74727565|4f54544f|74746366)
                  if [ "$SZ" -gt 1000000 ]; then
                    mv "$TMP" "$FONT_PATH"
                    echo "✅ 字体获取成功：$FONT_PATH (${SZ} 字节)"
                    exit 0
                  fi
                  echo "    体积异常，换下一个源"
                  ;;
                *) echo "    非字体文件（魔数不匹配），换下一个源" ;;
              esac
            else
              echo "    下载失败，换下一个源"
            fi
          done
          rm -f "$TMP"
          echo "::warning::所有字体源均失败，本次出包将使用 Godot 默认字体（中文可能显示为方块）。"
          exit 1

      # ----------------------------------------------------------------------
      # 字体缺失兜底：portrait_theme.tres 硬引用了字体文件，文件不在会产生
      # "referenced non-existent resource" 的缺失依赖错误。没拿到字体就把主题降级成无字体版本，
      # 保证导出链路上零缺失依赖。此步只在 CI 工作副本内改文件，不会回写仓库。
      - name: "步骤4 · 字体缺失兜底（主题降级，保证不因缺资源中止）"
        run: |
          set -u
          if [ -s "$FONT_PATH" ]; then
            echo "字体就位，主题保持原样（default_font 生效，中文正常）。"
            ls -la "$FONT_PATH"
          else
            echo "::warning::字体缺失 → 将 $THEME_PATH 降级为无字体主题，避免缺失依赖导致导出报错。"
            printf '%s\n' \
              '[gd_resource type="Theme" format=3]' \
              '' \
              '[resource]' > "$THEME_PATH"
            cat "$THEME_PATH"
          fi

      # ----------------------------------------------------------------------
      # 容器 job 的 $HOME=/github/home，Godot 只会在 $HOME 下找模板与编辑器设置，
      # 所以必须把镜像放在 /root 下的两份东西复制过来（barichello 官方 README 的做法）。
      - name: "步骤5 · 导出模板 + 编辑器设置就位"
        run: |
          set -eu
          GODOT_MINOR="$(godot --version 2>/dev/null | head -n1 | cut -d. -f1,2)"
          echo "检测到 Godot 主次版本：${GODOT_MINOR}"

          SRC_T="/root/.local/share/godot/export_templates"
          DST_T="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DST_T"
          if [ -d "$SRC_T" ] && [ "$SRC_T" != "$DST_T" ]; then
            cp -a "$SRC_T"/. "$DST_T"/
          fi
          echo "----- $DST_T -----"
          ls -la "$DST_T" || true
          # 硬校验：没有 android_debug.apk 模板就必定导不出包，早失败早定位。
          if ! ls "$DST_T"/*/android_debug.apk >/dev/null 2>&1; then
            echo "::error::找不到 Android 导出模板 android_debug.apk（期望在 $DST_T/<版本>.stable/ 下）。"
            exit 1
          fi
          echo "✅ Android 导出模板就位：$(ls "$DST_T"/*/android_debug.apk)"

          # 编辑器设置：Godot 靠 export/android/android_sdk_path 找 apksigner / zipalign。
          # 4.3 起编辑器设置按次版本号命名（editor_settings-4.3.tres）。
          mkdir -p "$HOME/.config/godot"
          ES="$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres"
          SRC_ES="/root/.config/godot/editor_settings-${GODOT_MINOR}.tres"
          if [ -f "$SRC_ES" ] && [ "$SRC_ES" != "$ES" ]; then
            cp -a "$SRC_ES" "$ES"
            echo "已复制镜像自带编辑器设置。"
          fi
          if [ ! -f "$ES" ]; then
            echo "镜像未提供编辑器设置，自行生成一份最小配置。"
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' > "$ES"
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-}"
          if [ -z "$JDK" ] && command -v javac >/dev/null 2>&1; then
            JDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          grep -q 'export/android/android_sdk_path' "$ES" \
            || echo "export/android/android_sdk_path = \"$SDK\"" >> "$ES"
          if [ -n "$JDK" ]; then
            grep -q 'export/android/java_sdk_path' "$ES" \
              || echo "export/android/java_sdk_path = \"$JDK\"" >> "$ES"
          fi
          echo "----- $ES -----"
          cat "$ES"

      # ----------------------------------------------------------------------
      # Godot 4 headless 导出 Android 必须能拿到 debug keystore，否则报
      # "Could not find keystore, unable to export"。这里显式生成一份并用环境变量注入，
      # 不依赖镜像自带的 /root/debug.keystore（宁可冗余，不可失败）。
      - name: "步骤6 · 生成 debug keystore 并注入环境变量"
        run: |
          set -eu
          KS="$GITHUB_WORKSPACE/debug.keystore"
          rm -f "$KS"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore "$KS" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12
          ls -la "$KS"
          keytool -list -keystore "$KS" -storepass android || true
          # Godot 4.2+ 支持用环境变量覆盖预设里的 keystore 配置。
          # PASSWORD / PASS 两种命名都写，规避版本间命名差异（多写一个不会有副作用）。
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASS=android"
          } >> "$GITHUB_ENV"
          echo "✅ debug keystore 已生成并注入环境变量。"

      # ----------------------------------------------------------------------
      # 首次 CI 检出没有 .godot/ 导入缓存。--export-* 虽然隐含 --import，
      # 但先单独跑一遍导入，能把"资源导入错误"和"导出错误"在日志里分开，便于定位。
      # Godot 4.3 已提供 --import（等价于 --editor --quit 并等待导入完成）；
      # 这里两种都跑一遍，任一失败都不阻塞，真正的判定交给下一步导出。
      - name: "步骤7 · 预导入资源（.godot 缓存）"
        run: |
          set -u
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          set +e
          timeout 900 godot --headless --import
          echo "[--import] 退出码=$?"
          timeout 900 godot --headless --editor --quit
          echo "[--editor --quit] 退出码=$?"
          set -e
          echo "----- .godot 目录 -----"
          ls -la .godot 2>/dev/null || echo "(未生成 .godot，若下一步导出成功可忽略)"

      # ----------------------------------------------------------------------
      # Godot 4 已把 --export 改名为 --export-debug / --export-release，旧名会报 unknown option。
      # 官方文档明确："<path> 目录必须已存在"，所以先 mkdir。
      - name: "步骤8 · 导出 Android APK（debug）"
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          godot --headless --verbose \
            --export-debug "$PRESET_NAME" \
            "$GITHUB_WORKSPACE/$OUT_APK"

      # ----------------------------------------------------------------------
      # Godot 偶有"报错但退出码为 0"的情况，必须自己校验产物。
      - name: "步骤9 · 校验 APK 存在、非空且已签名"
        run: |
          set -eu
          APK="$GITHUB_WORKSPACE/$OUT_APK"
          if [ ! -f "$APK" ]; then
            echo "::error::APK 未生成：$APK"
            ls -laR "$GITHUB_WORKSPACE/$OUT_DIR" || true
            exit 1
          fi
          SZ=$(stat -c%s "$APK")
          echo "APK 路径：$APK"
          echo "APK 体积：$SZ 字节"
          if [ "$SZ" -lt 1000000 ]; then
            echo "::error::APK 体积异常（${SZ} 字节，小于 1MB），基本可以断定导出不完整。"
            exit 1
          fi
          echo "----- APK 内容抽样 -----"
          unzip -l "$APK" | head -n 30 || true
          echo "----- 签名校验 -----"
          APKSIGNER="$(ls -1 "${ANDROID_HOME:-/usr/lib/android-sdk}"/build-tools/*/apksigner 2>/dev/null | tail -n1 || true)"
          if [ -n "$APKSIGNER" ]; then
            if "$APKSIGNER" verify --print-certs "$APK"; then
              echo "✅ APK 已正确签名，可直接侧载安装。"
            else
              echo "::warning::apksigner 校验未通过 —— APK 可能未签名，手机安装时会提示「应用未安装」。请检查 export_presets.cfg 的 package/signed 是否为 true。"
            fi
          else
            echo "::warning::未找到 apksigner，跳过签名校验。"
          fi

      # ----------------------------------------------------------------------
      - name: "步骤10 · 上传 APK 制品"
        uses: actions/upload-artifact@v4
        with:
          name: commart-android
          path: build/android/commart.apk
          if-no-files-found: error
          retention-days: 14

      # ======================================================================
      # 上架 Google Play 用的 release 签名（默认关闭，仅作指引）
      # ----------------------------------------------------------------------
      # 需要产出可上架的 release APK / AAB 时：
      # 1) 本地生成 keystore：
      #      keytool -genkey -v -keystore commart.keystore -alias commart \
      #              -keyalg RSA -keysize 2048 -validity 10000
      # 2) base64 编码：base64 -w0 commart.keystore > commart.keystore.b64
      # 3) 仓库 Settings → Secrets and variables → Actions → Secrets 里配置：
      #      PLAY_KEYSTORE_BASE64 / KEYSTORE_ALIAS / KEYSTORE_PASSWORD
      # 4) 取消下面注释。注意 release 走的是 --export-release + RELEASE 系列环境变量，
      #    不需要改 export_presets.cfg（环境变量优先级高于预设里的 keystore/release*）。
      # 5) 若要出 AAB：把 export_presets.cfg 的 gradle_build/export_format 改为 1
      #    且 gradle_build/use_gradle_build 改为 true（用 gradle 构建，耗时更长）。
      #
      # - name: "步骤R1 · 还原 release keystore"
      #   run: |
      #     echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
      #     {
      #       echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$GITHUB_WORKSPACE/release.keystore"
      #       echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.KEYSTORE_ALIAS }}"
      #       echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
      #       echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASS=${{ secrets.KEYSTORE_PASSWORD }}"
      #     } >> "$GITHUB_ENV"
